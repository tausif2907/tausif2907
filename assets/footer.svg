<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .big { fill: #F1EDFF; font-size: 18px; letter-spacing: 6px; font-weight: 600; }
    .small { fill: #9A92B8; font-size: 12px; letter-spacing: 4px; }
    .spark { fill: #A78BFA; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.8); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="999" height="109" rx="16" fill="#120F1C" stroke="#2A2440"/>
  <rect x="250" y="44.25" width="225" height="1.5" fill="url(#fadeL)"/>
  <rect x="525" y="44.25" width="225" height="1.5" fill="url(#fadeR)"/>
  <path class="spark" d="M500 34 503 42 511 45 503 48 500 56 497 48 489 45 497 42Z"/>
  <text class="sans big" x="500" y="82" text-anchor="middle">THANKS FOR STOPPING BY</text>
  <text class="sans small" x="500" y="100" text-anchor="middle">LET'S BUILD SOMETHING IMPACTFUL</text>
</svg>
